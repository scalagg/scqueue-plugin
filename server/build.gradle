plugins {
    id "application"
}

application {
    mainClassName "gg.scala.cougar.server.ScCougarServerBootstrap"
}

dependencies {
    implementation fileTree("cubed")
    implementation project(":common")

    implementation 'com.github.growlyx:flavor:0.1.2'
    implementation 'com.github.scalagg.scala-store:shared:217d6f05c0'

    implementation 'com.google.guava:guava:31.0.1-jre'

    implementation 'com.github.Revxrsal.Lamp:common:1.9'
    implementation 'com.github.Revxrsal.Lamp:cli:1.9'

    implementation "redis.clients:jedis:4.0.1"
    implementation "org.mongodb:mongo-java-driver:3.12.10"
    implementation "com.google.code.gson:gson:2.8.9"
}
