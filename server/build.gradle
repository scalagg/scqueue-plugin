plugins {
    id "application"
}

application {
    mainClassName "gg.scala.cougar.server.ScCougarServerBootstrap"
}

dependencies {
    implementation 'net.evilblock.cubed:velocity:1.3.7'
    implementation project(":common")

    implementation 'gg.scala.flavor:flavor:0.1.3.6'
    implementation 'gg.scala.store:shared:0.1.3'
    implementation 'gg.scala.aware:aware:1.0.8.2'

    implementation 'com.google.guava:guava:31.1-jre'

    implementation 'com.github.Revxrsal.Lamp:common:3.0.4'
    implementation 'com.github.Revxrsal.Lamp:cli:3.0.4'
    implementation 'com.github.Revxrsal.Lamp:ktx:3.0.4'

    implementation 'org.slf4j:slf4j-api:2.0.0-alpha6'
    implementation 'org.slf4j:slf4j-simple:2.0.0-alpha6'

    implementation "org.mongodb:mongo-java-driver:3.12.10"
    implementation "com.google.code.gson:gson:2.9.0"

    implementation "io.lettuce:lettuce-core:6.1.8.RELEASE"
}
